<!doctype html><html lang="de"><head><meta charset="utf-8">

</head><body>
<title>Plantyman</title>
<style>
@font-face{font-family:"Fraunces";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/fraunces.woff2) format("woff2")}
@font-face{font-family:"Fraunces";font-style:italic;font-weight:100 900;font-display:swap;src:url(fonts/fraunces-italic.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:200 1000;font-display:swap;src:url(fonts/nunito.woff2) format("woff2")}
body{font-variation-settings:"SOFT" 100}
</style>
<style>
/* Layout: one narrow column like a notebook page. The plant sits on the start screen, one task card at a time, everything else small at the edges. */
:root{
  --bg:#f5eee1; --surface:#fdf9f1; --ink:#4d4238; --muted:#85786a; --line:#e8dcc8;
  --accent:#b3d1ae; --on-accent:#334232; --marker:#fbdfb6; --marker-ink:#4d4238;
  --leaf:#9bbf96; --leaf2:#c4dcbc; --trunk:#bd9c7f; --soil:#d9c6ac; --seed:#9d7c5c;
  --lilac:#e4daee; --frost:#9cc3e6; --frost-ink:#3f7fb5;
  --high:#b25f4c; --mid:#96772c; --low:#5f8463;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-card:26px; --r-pill:99px;
}
:root[data-skin="dunkel"]{
  --bg:#2a241e; --surface:#352e27; --ink:#f0e6d6; --muted:#b5a692; --line:#4a4037;
  --accent:#a9c9a4; --on-accent:#1f2a1e; --marker:#f6d9a6; --marker-ink:#3b3228;
  --leaf:#8fb38a; --leaf2:#6f9a6c; --trunk:#b08d6f; --soil:#5c4c3c; --seed:#c9a988;
  --lilac:#4b4260; --frost:#6fa8dc; --frost-ink:#9cc8f0;
  --high:#f0a08e; --mid:#e6c57a; --low:#a9c9a4; color-scheme:dark }
:root[data-skin="wald"]{
  --bg:#1e2b24; --surface:#27382f; --ink:#eef3e6; --muted:#a9b8a4; --line:#3a4f43;
  --accent:#e3c77a; --on-accent:#2b2410; --marker:#e3c77a; --marker-ink:#2b2410;
  --leaf:#8fc08a; --leaf2:#5f9a6a; --trunk:#b79370; --soil:#4a3d2e; --seed:#e3c77a;
  --lilac:#3d4a5c; --frost:#7fb7e0; --frost-ink:#a9d3f2;
  --high:#f2a48f; --mid:#e3c77a; --low:#a6d3a0; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.app{max-width:30rem;margin-inline:auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
.top .left{display:flex;align-items:center;gap:4px;min-width:0}
.iconbtn{background:none;border:0;color:var(--muted);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--line);color:var(--ink)}
.iconbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
#back{margin-left:-10px}.right{display:flex;margin-right:-10px}
.brand{font-family:var(--display);font-weight:600;font-size:1.3rem;display:flex;align-items:center;gap:6px}
.brand svg{width:24px;height:24px}
.brand .st{stroke:var(--leaf);stroke-width:2.2;stroke-linecap:round;fill:none}.brand .lf{fill:var(--leaf)}.brand .lf2{fill:var(--leaf2)}
.claim{font-family:var(--display);font-style:italic;color:var(--muted);margin:0;font-size:1rem}
.linkbtn{background:none;border:0;padding:6px 0;font:inherit;font-size:.9rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:hover{color:var(--ink)}
button:focus-visible,input:focus-visible,label:focus-within,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:28px 22px 22px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.task{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,7vw,2.1rem);line-height:1.15;text-wrap:balance;overflow-wrap:anywhere;margin:0}
.chip{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid currentColor;border-radius:99px;padding:1px 9px}
.chip.cat{background:var(--lilac);border-color:transparent;color:var(--ink)}
.chip.high{color:var(--high)} .chip.mid{color:var(--mid)} .chip.low{color:var(--low)} .chip.ex{color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-weight:700;border-radius:var(--r-pill);padding:14px 18px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;width:100%}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-size:1.05rem}
.btn.small{width:auto;padding:9px 16px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.meter{display:flex;gap:6px;align-items:center;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.dot.used{background:var(--muted)}
.note{font-size:.92rem;color:var(--muted);margin:0}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.home{align-items:center;text-align:center}
.plant{width:160px;max-width:100%;height:auto}
.plant .leaf{fill:var(--leaf)} .plant .leaf2{fill:var(--leaf2)} .plant .trunk{fill:var(--trunk)}
.plant .soil{fill:var(--soil)} .plant .seed{fill:var(--seed)} .plant .stem{stroke:var(--stem,var(--leaf));stroke-width:3;stroke-linecap:round;fill:none}
.plant .halo{fill:var(--lilac)}
.streak{font-family:var(--display);font-weight:600;font-size:1.5rem;line-height:1.2;margin:0}
.home .actions{width:100%}
.points{font-variant-numeric:tabular-nums}
.plus{display:inline-block;background:var(--lilac);color:var(--ink);border-radius:99px;padding:3px 12px;font-weight:700;font-size:.95rem;align-self:flex-start}

.mark{background:linear-gradient(transparent 12%,var(--marker) 12%,var(--marker) 88%,transparent 88%);color:var(--marker-ink);padding:0 .18em;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.done-card .task{font-size:clamp(1.4rem,6vw,1.8rem);line-height:1.35}
@media (prefers-reduced-motion:no-preference){
  .done-card .mark{background-size:0 100%;background-repeat:no-repeat;animation:swipe .5s .1s ease-out forwards}
  @keyframes swipe{to{background-size:100% 100%}}
}

.pick{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pick button{text-align:left;font-weight:600;border-radius:18px}

details.steps{font-size:.92rem;color:var(--muted)}
details.steps summary{cursor:pointer;width:fit-content}
.sublist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.sublist li{display:flex;gap:10px;align-items:center;justify-content:space-between}
.sublist label{display:flex;gap:10px;align-items:baseline;min-width:0;overflow-wrap:anywhere;color:var(--ink);cursor:pointer}
.sublist input:checked+span{text-decoration:line-through;color:var(--muted)}
input[type=checkbox]{accent-color:var(--accent);width:1.05rem;height:1.05rem;flex:none}

form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.legend{font-size:.88rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=time],textarea{font:inherit;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border:0;padding:0;margin:0}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg.three{grid-template-columns:repeat(3,1fr)}
.check{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px;border:0;padding:0;margin:0}
.pills label{border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:.9rem;cursor:pointer}
.pills input{position:absolute;opacity:0;pointer-events:none}
.pills label:has(input:checked){background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r-card) * .6);padding:14px 14px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-weight:600;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.82rem;color:var(--muted)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:.9rem}
.bars .lab{min-width:0;overflow-wrap:anywhere;max-width:9rem}
.bars .track{height:12px;display:flex}
.bars .fill{background:var(--leaf);border-radius:0 4px 4px 0;min-width:2px;height:100%}
.bars .fill.zero{background:var(--line)}
.bars .val{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.timer{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline}
.timer b{font-family:var(--display);font-weight:600;font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}
.timer span{color:var(--muted);font-size:.9rem}
.timer .bar{grid-column:1/-1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.trophy{width:1.1em;height:1.1em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hint{margin:0;font-size:.9rem;background:var(--marker);color:var(--marker-ink);border-radius:12px;padding:8px 12px}
.seg label{border:1px solid var(--line);border-radius:99px;padding:9px 4px;text-align:center;font-size:.9rem;cursor:pointer;min-width:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.addrow{display:flex;gap:8px}

.calhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.calcard{touch-action:pan-y}
.cal .wd{font-size:.75rem;color:var(--muted);font-weight:700}
.day{aspect-ratio:1;width:100%;max-width:44px;justify-self:center;display:grid;place-items:center;border-radius:50%;font-size:.92rem;font-variant-numeric:tabular-nums;position:relative;border:2px solid transparent}
.day.done{background:var(--accent);color:var(--on-accent);font-weight:700}
.day.missed{border:1.5px dashed var(--muted);color:var(--muted)}
.day.fz{border:2px solid var(--frost)}
.day.fz::after{content:"\273B";position:absolute;top:-7px;right:-5px;font-size:.8rem;color:var(--frost-ink);line-height:1}
.day.today{text-decoration:underline;text-underline-offset:3px;font-weight:700}
.key{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.85rem;color:var(--muted)}
.key span{display:flex;align-items:center;gap:8px}
.key .day{width:22px;font-size:0;flex:none}
button.day{background:none;color:inherit;font:inherit;font-size:.92rem;padding:0;cursor:pointer}
.day.sel{outline:2px solid var(--ink);outline-offset:2px}
.duedot{position:absolute;bottom:2px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:var(--high)}
.day.done .duedot{background:var(--on-accent)}
.key .day .duedot{bottom:8px}
input[type=date]{font:inherit;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;flex:1 1 9rem;min-height:3.2rem}
.sub{font-size:.88rem;font-weight:700;color:var(--muted);margin:4px 0 0}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0}
.section{display:flex;flex-direction:column;gap:10px}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{display:flex;gap:12px;align-items:baseline;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.list .t{min-width:0;overflow-wrap:anywhere;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.list .ops{display:flex;gap:14px;flex:none}
.stats{font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums;margin:0}

.foot{align-items:center}
.plant{width:124px}
.btn.draw{font-family:var(--display);font-weight:600;font-size:1.45rem;padding:24px 18px}
.lead{font-family:var(--display);font-weight:600;font-size:clamp(1.35rem,6vw,1.7rem);line-height:1.25;text-wrap:balance;margin:0}
.back-card{align-items:center;justify-content:center;text-align:center;min-height:15rem}
.sprout{width:72px;height:72px}
textarea{resize:vertical;min-height:6.5rem;font-size:.82rem;line-height:1.4;font-family:ui-monospace,Menlo,Consolas,monospace}
input[type=file]{font:inherit;font-size:.9rem;color:var(--muted);max-width:100%}
.hint .linkbtn{color:inherit;padding:0;font-weight:700}
.how{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:12px}
.how li::marker{font-family:var(--display);font-weight:600;color:var(--muted)}
.sprout .st{stroke:var(--leaf);stroke-width:2.2;stroke-linecap:round;fill:none}.sprout .lf{fill:var(--leaf)}.sprout .lf2{fill:var(--leaf2)}
a.btn{display:inline-block;text-align:center;text-decoration:none}
.btn small{display:block;font-weight:600;font-size:.8rem;opacity:.85;margin-top:1px}
.duo{display:flex;flex-wrap:wrap;gap:10px}
.duo .btn{flex:1 1 7.5rem;font-size:1rem;padding:11px 6px;border-radius:22px;min-width:0}
.duo .btn small{font-size:.76rem;white-space:nowrap}
.addrow{flex-wrap:wrap}
.addrow input{flex:1 1 9rem}
.plantbtn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:20px}
.stagecap{font-size:.85rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 12px}
.stages{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.stages li{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.stages .plant{width:56px}
.stages b{font-family:var(--display);font-weight:600;font-size:1.05rem;display:block}
.stages .when{font-size:.85rem;color:var(--muted)}
.stages .st8{font-size:.82rem;color:var(--muted);text-align:right}
.stages li.here{background:var(--lilac);border-radius:16px;border-bottom-color:transparent;padding-inline:10px;margin-inline:-10px}
.stages li.here .st8,.stages li.here .when{color:var(--ink)}
.stages li.here .st8{font-weight:700}
.stages li.ahead .plant{opacity:.45}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:none;cursor:pointer;padding:0;position:relative}
.tick::before{content:"";position:absolute;inset:-9px}
.tick:hover{border-color:var(--leaf);background:var(--leaf2)}
.list li.open{display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:center}
.list li.open .ops{grid-column:2}
textarea.plain{font-family:var(--body);font-size:1rem;line-height:1.5;min-height:5rem}
.notetext{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
input[type=number]{font:inherit;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:7rem}
.inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600}
.explain p{margin:0}
@media (prefers-reduced-motion:no-preference){
  .back-card .sprout{animation:sway .55s ease-in-out both}
  @keyframes sway{0%{transform:scale(.55) rotate(-14deg);opacity:.3}60%{transform:scale(1.1) rotate(7deg);opacity:1}100%{transform:scale(1) rotate(0)}}
  .calcard.slide-next{animation:slidenext .25s ease-out both}
  .calcard.slide-prev{animation:slideprev .25s ease-out both}
  @keyframes slidenext{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
  @keyframes slideprev{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
  .card.reveal{animation:unfold .4s cubic-bezier(.2,.8,.3,1.1) both;transform-origin:50% 0}
  @keyframes unfold{from{transform:perspective(700px) rotateX(-75deg);opacity:0}to{transform:none;opacity:1}}
}
</style>

<div class="app">
  <header class="top">
    <div class="left">
      <button class="iconbtn" id="back" type="button" aria-label="Zurück" title="Zurück" hidden><svg viewBox="0 0 24 24" stroke-width="2.2"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>

<script>
/*LOGIC*/
var MAX_SKIPS = 5, BASE_POINTS = 10, MIN_POINTS = 5, MONTH_BONUS = 100, MAX_FREEZES = 6, FREEZES_PER_WEEK = 2, WEEK_BONUS = 20, TIMER_MIN = 10;
var PRIO_RANK = { high: 0, mid: 1, low: 2, none: 3 };
var STAGES = [
  { from: 0, key: 'seed' }, { from: 1, key: 'seedling' }, { from: 3, key: 'sprout' },
  { from: 7, key: 'shrub' }, { from: 14, key: 'sapling' }, { from: 30, key: 'tree' }
];
/* Texts: every visible word comes from I18N (defined below) through t(key, ...). A value is either a string or a function of the given values.
   A missing key falls back to German. setLang also names the plant stages and the garden items. */
var LANG = 'de';
function t(k) {
  var d = I18N[LANG] || I18N.de, v = k in d ? d[k] : I18N.de[k];
  if (v === undefined) return k;
  return typeof v === 'function' ? v.apply(null, Array.prototype.slice.call(arguments, 1)) : v;
}
function setLang(l) {
  LANG = I18N[l] ? l : 'de';
  STAGES.forEach(function (st) { st.name = t('stage.' + st.key); });
  LOOKS.forEach(function (lk) { lk.name = t('look.' + lk.id); });
}
/* Picks a language from the phone's preferred languages: German for German, English for everything else. */
function langFor(list) {
  for (var i = 0; i < (list || []).length; i++) { var c = String(list[i] || '').slice(0, 2).toLowerCase(); if (I18N[c]) return c; }
  return 'en';
}

function dayKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function yesterdayKey(d) { var y = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1); return dayKey(y); }
function weekKey(d) {
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var wd = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - wd);
  var y = t.getUTCFullYear();
  var w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7);
  return y + '-W' + String(w).padStart(2, '0');
